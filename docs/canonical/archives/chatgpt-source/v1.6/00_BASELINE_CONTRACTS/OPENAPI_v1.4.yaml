openapi: 3.1.0
info:
  title: SNAPN Sports V2 API
  version: 1.4.0
  description: >-
    Canonical /v2 contract for the Implementation Lock package. Server-side authorization,
    tenant/data-scope checks, safeguarding gates, idempotency, audit, and feature gates are mandatory.
servers:
  - url: https://api.example.invalid
    description: Placeholder only. Deployment hostname is environment configuration.
tags:
  - name: Identity
  - name: Role
  - name: Guardian
  - name: Teams
  - name: Stadium
  - name: Schedule
  - name: Training
  - name: Matches
  - name: Community
  - name: Media
  - name: Communication
  - name: Career
  - name: Opportunities
  - name: Search
  - name: Sync
  - name: Features
  - name: Admin
security:
  - bearerAuth: []
paths:
  /v2/signup:
    post:
      tags: [Identity]
      security: []
      summary: Create PLAYER or MANAGER account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiUserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v2/me:
    get:
      tags: [Identity]
      operationId: getMe
      responses:
        '200':
          description: Current user projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v2/me/role-preferences:
    patch:
      tags: [Role]
      summary: Change manager role preferences only; does not grant permission
      operationId: updateRolePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/ManagerRole'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/role-verifications:
    post:
      tags: [Role]
      operationId: createRoleVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleVerificationCreate'
      responses:
        '201':
          description: Verification case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleVerificationResponse'
  /v2/manager/switch-role:
    post:
      tags: [Role]
      summary: Switch active verified RoleGrant
      operationId: switchManagerRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_grant_id]
              properties:
                role_grant_id: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/guardian-invites:
    post:
      tags: [Guardian]
      operationId: createGuardianInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_user_id]
              properties:
                athlete_user_id: {type: string, format: uuid}
                relation_type: {type: string, enum: [PRIMARY_GUARDIAN, CO_GUARDIAN]}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/guardian-invites/{token}/accept:
    post:
      tags: [Guardian]
      security: []
      operationId: acceptGuardianInvite
      parameters:
        - {$ref: '#/components/parameters/InviteToken'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '410': {$ref: '#/components/responses/Gone'}
  /v2/teams:
    get:
      tags: [Teams]
      operationId: listVisibleTeams
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Permission-filtered teams
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamListResponse'}
  /v2/teams/{team_id}/squad:
    get:
      tags: [Teams]
      operationId: getSquad
      parameters:
        - {$ref: '#/components/parameters/TeamId'}
      responses:
        '200':
          description: Role-projected squad
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SquadResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/stadium/home:
    get:
      tags: [Stadium]
      operationId: getStadiumHome
      responses:
        '200':
          description: Recipe, formation, user position, home state and feature visibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StadiumHomeResponse'}
  /v2/stadium/recipe:
    put:
      tags: [Stadium]
      operationId: saveStadiumRecipe
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StadiumRecipeSave'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v2/events:
    get:
      tags: [Schedule]
      operationId: listEvents
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Schedule events with optional Earthus context projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventListResponse'}
  /v2/training-sessions:
    post:
      tags: [Training]
      operationId: createTrainingSession
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainingSessionCreate'}
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSessionResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/training-sessions/{session_id}/events:
    post:
      tags: [Training]
      operationId: appendTrainingEvent
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainingEventCreate'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v2/matches:
    get:
      tags: [Matches]
      operationId: listMatches
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - name: state
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Role-filtered matches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchListResponse'}
  /v2/matches/{match_id}/events:
    post:
      tags: [Matches]
      operationId: appendMatchEvent
      parameters:
        - {$ref: '#/components/parameters/MatchId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchEventCreate'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v2/community/feed:
    get:
      tags: [Community]
      summary: V2.0 preserves Legacy ordering when Feed Intelligence flag is OFF
      operationId: getCommunityFeed
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Community feed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityFeedResponse'}
  /v2/community/posts:
    post:
      tags: [Community]
      operationId: createCommunityPost
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunityPostCreate'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/community/posts/{post_id}/comments:
    post:
      tags: [Community]
      operationId: addCommunityComment
      parameters:
        - name: post_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 5000}
                parent_comment_id: {type: [string, 'null'], format: uuid}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
  /v2/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaUploadCreate'}
      responses:
        '201':
          description: Pre-signed upload session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaUploadResponse'}
  /v2/communication/threads:
    post:
      tags: [Communication]
      operationId: createCommunicationThread
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunicationThreadCreate'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/communication/threads/{thread_id}/messages:
    post:
      tags: [Communication]
      operationId: sendCommunicationMessage
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 5000}
                media_asset_id: {type: [string, 'null'], format: uuid}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/athletes/{athlete_id}/career:
    get:
      tags: [Career]
      operationId: getCareerPassport
      parameters:
        - {$ref: '#/components/parameters/AthleteId'}
      responses:
        '200':
          description: Permission-projected career passport
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CareerPassportResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/opportunities:
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Consent/safety filtered opportunities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpportunityListResponse'}
    post:
      tags: [Opportunities]
      operationId: createOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpportunityCreate'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/search:
    get:
      tags: [Search]
      summary: Permission-aware prefilter and post-check; hidden resource count/facet leak forbidden
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: type
          in: query
          schema: {type: string, enum: [community, team, organization, video, match, portfolio]}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Permission-filtered results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
  /v2/sync/batch:
    post:
      tags: [Sync]
      operationId: syncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncBatchRequest'}
      responses:
        '200':
          description: Accepted/rejected/conflicts + cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncBatchResponse'}
  /v2/features:
    get:
      tags: [Features]
      operationId: getFeatures
      responses:
        '200':
          description: Renderable capabilities after hard gates and scoped rules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureResponse'}
  /v2/admin/role-verifications:
    get:
      tags: [Admin]
      operationId: adminListRoleVerifications
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v2/admin/feature-flags/{flag_key}:
    patch:
      tags: [Admin]
      summary: Hard-gated hardware/AI flags require release authority and cannot be enabled by ordinary org admin
      operationId: adminUpdateFeatureFlag
      parameters:
        - name: flag_key
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
                scope_type: {type: string}
                scope_value: {type: [string, 'null']}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string}
    InviteToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 16}
    TeamId:
      name: team_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MatchId:
      name: match_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AthleteId:
      name: athlete_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericResponse'}
    Accepted:
      description: Accepted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericResponse'}
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: Authentication required
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: Server-side authorization/safeguarding denial
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: Version/idempotency/state conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Gone:
      description: Expired or revoked token/resource
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    ManagerRole:
      type: string
      enum: [COACH, TEAM_MANAGER, CLUB_DIRECTOR, REFEREE, AGENT, ANALYST]
    SignupRequest:
      type: object
      required: [account_type, display_name, auth_token]
      properties:
        account_type: {type: string, enum: [PLAYER, MANAGER]}
        display_name: {type: string, minLength: 1, maxLength: 100}
        auth_token: {type: string, minLength: 1}
        locale: {type: string, default: ko-KR}
    RoleVerificationCreate:
      type: object
      required: [requested_role]
      properties:
        requested_role: {$ref: '#/components/schemas/ManagerRole'}
        organization_id: {type: [string, 'null'], format: uuid}
        team_id: {type: [string, 'null'], format: uuid}
    RoleVerificationResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
        - type: object
    GenericResponse:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ApiUserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, account_type, display_name]
          properties:
            id: {type: string, format: uuid}
            account_type: {type: string}
            display_name: {type: string}
            active_role_grant: {type: [object, 'null']}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      required: [request_id, server_time]
      properties:
        request_id: {type: string}
        server_time: {type: string, format: date-time}
        next_cursor: {type: [string, 'null']}
        version: {type: [integer, 'null']}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            retryable: {type: boolean}
            details: {}
    TeamListResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    SquadResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    StadiumHomeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [recipe, formation, home_state, feature_visibility]
          properties:
            recipe:
              type: object
              required: [id, version]
              properties:
                id: {type: string}
                version: {type: integer}
            formation:
              type: object
              required: [system, players]
              properties:
                system: {type: string}
                players:
                  type: array
                  items:
                    type: object
                    required: [athlete_id, x, y, is_me]
                    properties:
                      athlete_id: {type: string, format: uuid}
                      slot: {type: [string, 'null']}
                      x: {type: number, minimum: 0, maximum: 1}
                      y: {type: number, minimum: 0, maximum: 1}
                      is_me: {type: boolean}
            home_state:
              type: object
              properties:
                primary: {type: string}
                title: {type: string}
                route: {type: [string, 'null']}
            feature_visibility:
              type: object
              required: [epts, camera_ai, sports_ai]
              properties:
                epts: {type: boolean, const: false}
                camera_ai: {type: boolean, const: false}
                sports_ai: {type: boolean, const: false}
        meta: {$ref: '#/components/schemas/Meta'}
    StadiumRecipeSave:
      type: object
      required: [style_family_id, modules, decor_seed]
      properties:
        style_family_id: {type: string}
        modules: {type: object}
        palette: {type: object}
        decor_seed: {type: integer}
    EventListResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    TrainingSessionCreate:
      type: object
      required: [organization_id, team_id]
      properties:
        organization_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        venue_id: {type: [string, 'null'], format: uuid}
        objective: {type: [string, 'null']}
        starts_at: {type: [string, 'null'], format: date-time}
    TrainingSessionResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    TrainingEventCreate:
      type: object
      required: [event_type, event_time, payload]
      properties:
        event_type: {type: string}
        event_time: {type: string, format: date-time}
        local_event_id: {type: [string, 'null']}
        athlete_user_id: {type: [string, 'null'], format: uuid}
        payload: {type: object}
    MatchListResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    MatchEventCreate:
      type: object
      required: [event_type, event_seq, payload]
      properties:
        event_type: {type: string}
        event_seq: {type: integer, minimum: 1}
        team_id: {type: [string, 'null'], format: uuid}
        athlete_user_id: {type: [string, 'null'], format: uuid}
        event_time_seconds: {type: [integer, 'null'], minimum: 0}
        payload: {type: object}
    CommunityFeedResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    CommunityPostCreate:
      type: object
      required: [body, visibility]
      properties:
        body: {type: string, minLength: 1, maxLength: 20000}
        visibility: {type: string, enum: [PUBLIC, CLUB, TEAM, FOLLOWERS, PRIVATE]}
        organization_id: {type: [string, 'null'], format: uuid}
        team_id: {type: [string, 'null'], format: uuid}
        media_asset_ids:
          type: array
          items: {type: string, format: uuid}
    MediaUploadCreate:
      type: object
      required: [asset_type, mime_type, byte_size]
      properties:
        asset_type: {type: string, enum: [IMAGE, VIDEO, AUDIO, DOCUMENT]}
        mime_type: {type: string}
        byte_size: {type: integer, minimum: 0}
        checksum_sha256: {type: [string, 'null']}
    MediaUploadResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    CommunicationThreadCreate:
      type: object
      required: [context_type, member_user_ids]
      properties:
        context_type: {type: string}
        context_id: {type: [string, 'null']}
        title: {type: [string, 'null']}
        member_user_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    CareerPassportResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    OpportunityCreate:
      type: object
      required: [opportunity_type, title, eligibility]
      properties:
        opportunity_type: {type: string, enum: [TRYOUT, TRIAL, CONSULTATION, CAMP, SCOUTING_INTEREST]}
        title: {type: string}
        eligibility: {type: object}
        visibility: {type: string, enum: [PRIVATE, CONSENTED, PUBLIC], default: CONSENTED}
    OpportunityListResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    SearchResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    SyncBatchRequest:
      type: object
      required: [client_id, events]
      properties:
        client_id: {type: string}
        cursor: {type: [string, 'null']}
        events:
          type: array
          items:
            type: object
            required: [event_id, local_seq, type, idempotency_key, payload]
            properties:
              event_id: {type: string}
              local_seq: {type: integer}
              type: {type: string}
              idempotency_key: {type: string}
              payload: {type: object}
    SyncBatchResponse:
      allOf:
        - {$ref: '#/components/schemas/GenericResponse'}
    FeatureResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            EPTS: {type: boolean, const: false}
            CAMERA_AI: {type: boolean, const: false}
            SPORTS_AI: {type: boolean, const: false}
            COMMUNITY_FEED_INTELLIGENCE: {type: boolean}
            EARTHUS_CONTEXT: {type: boolean}
        meta: {$ref: '#/components/schemas/Meta'}
