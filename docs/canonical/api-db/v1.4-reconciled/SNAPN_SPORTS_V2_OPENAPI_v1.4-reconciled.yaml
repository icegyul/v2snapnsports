      operationId: syncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Accepted/rejected/conflicts + cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
  /v2/features:
    get:
