  /v2/opportunities:
    get:
      tags:
      - Opportunities
      operationId: listOpportunities
      parameters:
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Consent/safety filtered opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
    post:
      tags:
      - Opportunities
      operationId: createOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/search:
    get:
      tags:
      - Search
      summary: Permission-aware prefilter and post-check; hidden resource count/facet leak forbidden
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: type
        in: query
        schema:
          type: string
          enum:
          - community
          - team
          - organization
          - video
          - match
          - portfolio
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Permission-filtered results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /v2/sync/batch:
    post:
      tags:
