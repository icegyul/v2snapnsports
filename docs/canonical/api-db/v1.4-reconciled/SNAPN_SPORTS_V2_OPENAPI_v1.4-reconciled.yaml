  /v2/community/posts/{post_id}/comments:
    post:
      tags:
      - Community
      operationId: addCommunityComment
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  maxLength: 5000
                parent_comment_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /v2/media/uploads:
    post:
