openapi: 3.1.0
info:
  title: SNAPN Sports V2 API
  version: 1.4.0-packs01-04-reconciled
  description: 'Canonical /v2 contract for the Implementation Lock package. Server-side authorization, tenant/data-scope
    checks, safeguarding gates, idempotency, audit, and feature gates are mandatory.


    PACKS 01-04 reconciled additive contract. Production cutover is not authorized.'
servers:
- url: https://api.example.invalid
  description: Placeholder only. Deployment hostname is environment configuration.
tags:
- name: Identity
- name: Role
- name: Guardian
- name: Teams
- name: Stadium
- name: Schedule
- name: Training
- name: Matches
- name: Community
- name: Media
- name: Communication
- name: Career
- name: Opportunities
- name: Search
- name: Sync
- name: Features
- name: Admin
security:
- bearerAuth: []
paths:
  /v2/signup:
    post:
      tags:
      - Identity
      security: []
      summary: Create PLAYER or MANAGER account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v2/me:
    get:
      tags:
      - Identity
      operationId: getMe
      responses:
        '200':
          description: Current user projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/me/role-preferences:
    patch:
      tags:
      - Role
      summary: Change manager role preferences only; does not grant permission
      operationId: updateRolePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roles
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ManagerRole'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/role-verifications:
    post:
      tags:
      - Role
      operationId: createRoleVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleVerificationCreate'
      responses:
        '201':
          description: Verification case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleVerificationResponse'
  /v2/manager/switch-role:
    post:
      tags:
      - Role
      summary: Switch active verified RoleGrant
      operationId: switchManagerRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role_grant_id
              properties:
                role_grant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/guardian-invites:
    post:
      tags:
      - Guardian
      operationId: createGuardianInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - athlete_user_id
              properties:
                athlete_user_id:
                  type: string
                  format: uuid
                relation_type:
                  type: string
                  enum:
                  - PRIMARY_GUARDIAN
                  - CO_GUARDIAN
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/guardian-invites/{token}/accept:
    post:
      tags:
      - Guardian
      security: []
      operationId: acceptGuardianInvite
      parameters:
      - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '410':
          $ref: '#/components/responses/Gone'
  /v2/teams:
    get:
      tags:
      - Teams
      operationId: listVisibleTeams
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Permission-filtered teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
  /v2/teams/{team_id}/squad:
    get:
      tags:
      - Teams
      operationId: getSquad
      parameters:
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Role-projected squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquadResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/stadium/home:
    get:
      tags:
      - Stadium
      operationId: getStadiumHome
      responses:
        '200':
          description: Recipe, formation, user position, home state and feature visibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StadiumHomeResponse'
  /v2/stadium/recipe:
    put:
      tags:
      - Stadium
      operationId: saveStadiumRecipe
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StadiumRecipeSave'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
  /v2/events:
    get:
      tags:
      - Schedule
      operationId: listEvents
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Schedule events with optional Earthus context projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
  /v2/training-sessions:
    post:
      tags:
      - Training
      operationId: createTrainingSession
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSessionCreate'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/training-sessions/{session_id}/events:
    post:
      tags:
      - Training
      operationId: appendTrainingEvent
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingEventCreate'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '409':
          $ref: '#/components/responses/Conflict'
  /v2/matches:
    get:
      tags:
      - Matches
      operationId: listMatches
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Role-filtered matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
  /v2/matches/{match_id}/events:
    post:
      tags:
      - Matches
      operationId: appendMatchEvent
      parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchEventCreate'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v2/community/feed:
    get:
      tags:
      - Community
      summary: V2.0 preserves Legacy ordering when Feed Intelligence flag is OFF
      operationId: getCommunityFeed
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
