      - Admin
      summary: Hard-gated hardware/AI flags require release authority and cannot be enabled by ordinary org admin
      operationId: adminUpdateFeatureFlag
      parameters:
      - name: flag_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                scope_type:
                  type: string
                scope_value:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
