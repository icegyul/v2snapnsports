        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Communication
      summary: 기존 logical operation을 유지하되 physical v1.4 naming/aggregate root에 맞춰 승격
      operationId: listCommunicationThreads
      security:
      - bearerAuth: []
      x-reconciliation-id: P2-OPG-008
      x-pack: PACK 02
      x-decision: OPENAPI_PROMOTION
      x-permission: RoleGrant/athlete ownership + consent + safeguarding + visibility
      x-audit: Consent/share/message mutation audit; read access decision observable
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request / state transition
        '401':
          description: Authentication required
        '403':
          description: Permission, consent, safeguarding, or hard feature gate denied
        '409':
          description: Version, idempotency, or state conflict
  /v2/communication/threads/{thread_id}/messages:
    post:
      tags:
      - Communication
      operationId: sendCommunicationMessage
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  maxLength: 5000
                media_asset_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Communication
      summary: 기존 logical operation을 유지하되 physical v1.4 naming/aggregate root에 맞춰 승격
      operationId: listCommunicationMessages
      security:
      - bearerAuth: []
      x-reconciliation-id: P2-OPG-009
