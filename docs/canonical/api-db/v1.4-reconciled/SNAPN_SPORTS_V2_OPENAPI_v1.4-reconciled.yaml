components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 16
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AthleteId:
      name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Server-side authorization/safeguarding denial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version/idempotency/state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Expired or revoked token/resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ManagerRole:
      type: string
      enum:
      - COACH
      - TEAM_MANAGER
      - CLUB_DIRECTOR
      - REFEREE
      - AGENT
      - ANALYST
    SignupRequest:
      type: object
      required:
      - account_type
      - display_name
      - auth_token
      properties:
        account_type:
          type: string
          enum:
          - PLAYER
          - MANAGER
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        auth_token:
          type: string
          minLength: 1
        locale:
          type: string
          default: ko-KR
    RoleVerificationCreate:
      type: object
      required:
      - requested_role
      properties:
        requested_role:
          $ref: '#/components/schemas/ManagerRole'
        organization_id:
          type:
          - string
          - 'null'
          format: uuid
        team_id:
          type:
          - string
          - 'null'
          format: uuid
    RoleVerificationResponse:
      allOf:
      - $ref: '#/components/schemas/GenericResponse'
      - type: object
    GenericResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ApiUserResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - id
          - account_type
          - display_name
          properties:
            id:
              type: string
              format: uuid
            account_type:
              type: string
            display_name:
              type: string
            active_role_grant:
              type:
              - object
              - 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      required:
      - request_id
      - server_time
      properties:
        request_id:
          type: string
        server_time:
          type: string
          format: date-time
        next_cursor:
          type:
          - string
          - 'null'
        version:
          type:
          - integer
          - 'null'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details: {}
    TeamListResponse:
      allOf:
      - $ref: '#/components/schemas/GenericResponse'
    SquadResponse:
      allOf:
      - $ref: '#/components/schemas/GenericResponse'
    StadiumHomeResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - recipe
          - formation
          - home_state
          - feature_visibility
          properties:
            recipe:
              type: object
              required:
              - id
              - version
              properties:
                id:
                  type: string
                version:
                  type: integer
            formation:
              type: object
              required:
              - system
              - players
              properties:
                system:
                  type: string
                players:
                  type: array
                  items:
                    type: object
                    required:
                    - athlete_id
                    - x
                    - y
                    - is_me
                    properties:
                      athlete_id:
                        type: string
                        format: uuid
                      slot:
                        type:
                        - string
                        - 'null'
                      x:
                        type: number
                        minimum: 0
                        maximum: 1
                      y:
                        type: number
                        minimum: 0
                        maximum: 1
                      is_me:
                        type: boolean
            home_state:
              type: object
              properties:
                primary:
                  type: string
                title:
                  type: string
                route:
                  type:
                  - string
                  - 'null'
            feature_visibility:
              type: object
              required:
              - epts
              - camera_ai
              - sports_ai
              properties:
                epts:
                  type: boolean
                  const: false
                camera_ai:
                  type: boolean
                  const: false
                sports_ai:
                  type: boolean
                  const: false
        meta:
          $ref: '#/components/schemas/Meta'
    StadiumRecipeSave:
      type: object
      required:
      - style_family_id
      - modules
      - decor_seed
      properties:
        style_family_id:
          type: string
        modules:
          type: object
        palette:
          type: object
        decor_seed:
          type: integer
    EventListResponse:
