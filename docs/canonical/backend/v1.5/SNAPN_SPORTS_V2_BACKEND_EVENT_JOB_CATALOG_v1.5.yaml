jobs:
- name: outbox_dispatcher
  source: platform.outbox_events
  idempotency_key: event_id
  dlq: true
- name: notification_fanout
  source: notification.requested
  idempotency_key: event_id+recipient_id
  dlq: true
- name: media_processing
  source: media.asset.uploaded
  idempotency_key: asset_id+version
  dlq: true
- name: privacy_cascade
  source: privacy.request.approved
  idempotency_key: privacy_request_item_id
  dlq: true
- name: search_index
  source: indexable domain events
  idempotency_key: resource_id+version
  dlq: true
- name: earthus_refresh
  source: cache miss/refresh schedule
  idempotency_key: venue_id+time_bucket
  dlq: false
  fallback: stale cache
- name: cache_invalidation
  source: domain events
  idempotency_key: event_id
  dlq: false
  fallback: TTL
- name: analytics_ingest
  source: product/domain events
  idempotency_key: event_id
  dlq: false
  privacy: drop/minimize PII
- name: migration_verification
  source: ops.migration_checkpoint
  idempotency_key: checkpoint_id
  dlq: true
- name: role_verification_expiry
  source: scheduler
  idempotency_key: verification_id+expiry
  dlq: false
- name: guardian_invite_expiry
  source: scheduler
  idempotency_key: invite_id+expiry
  dlq: false
- name: opportunity_expiry
  source: scheduler
  idempotency_key: opportunity_id+expiry
  dlq: false
