name: Refresh Three Lock

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build: synchronize three package lock"
          git push
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v4
        with:
          name: three-package-lock
          path: package-lock.json
          retention-days: 1
