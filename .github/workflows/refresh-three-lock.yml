name: Refresh Three Lock

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - package.json

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v4
        with:
          name: three-package-lock
          path: package-lock.json
          retention-days: 1
