name: Stadium V15.31 Exterior Facade

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v1531-exterior-facade.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add exterior stadium architecture
        run: python .github/scripts/stadium_v1531_exterior_facade.py
      - name: Commit V15.31 exterior facade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: build V15.31 stadium exterior facade"
          git push
