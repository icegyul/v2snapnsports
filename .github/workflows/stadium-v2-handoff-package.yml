name: Stadium V2 Handoff Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v2-handoff-package.trigger

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Build one-file Stadium handoff ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/handoff-out"
          ROOT="$OUT/SNAPN_SPORTS_V2_STADIUM_HANDOFF_2026-08-30"
          REPO="$ROOT/REPOSITORY"
          HANDOFF="$ROOT/HANDOFF"
          rm -rf "$OUT"
          mkdir -p "$REPO" "$HANDOFF"

          git rev-parse HEAD > "$ROOT/SOURCE_HEAD.txt"
          git branch --show-current > "$ROOT/SOURCE_BRANCH.txt"
          git status --short > "$ROOT/SOURCE_GIT_STATUS.txt"
          git log -50 --oneline --decorate > "$ROOT/RECENT_50_COMMITS.txt"

          rsync -a ./ "$REPO/" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '**/node_modules/' \
            --exclude 'dist/' \
            --exclude '**/dist/' \
            --exclude 'output/' \
            --exclude '**/output/' \
            --exclude '.cache/' \
            --exclude '**/.cache/' \
            --exclude 'coverage/' \
            --exclude '**/coverage/' \
            --exclude '.DS_Store'

          cp docs/handoff/2026-08-30/SNAPN_STADIUM_V2_CONTINUATION_DIRECTIVE_KO.md "$HANDOFF/DEVELOPMENT_DIRECTIVE_KO.md"
          cp docs/handoff/2026-08-30/SNAPN_STADIUM_V2_CURRENT_STATUS_KO.md "$HANDOFF/CURRENT_STATUS_KO.md"

          find "$REPO" -type f -printf '%P\n' | LC_ALL=C sort > "$ROOT/FILE_MANIFEST.txt"

          cat > "$ROOT/README_FIRST_KO.md" <<'EOF'
          # SNAPN SPORTS V2 — 3D STADIUM 통합 인수인계 패키지

          이 패키지는 새 프로젝트가 아닙니다.

          `REPOSITORY/`가 현재 SnapN Sports V2 Stadium continuation source입니다.
          먼저 `HANDOFF/DEVELOPMENT_DIRECTIVE_KO.md`와 `HANDOFF/CURRENT_STATUS_KO.md`를 읽으십시오.

          ## 시작 순서

          1. `SOURCE_HEAD.txt` 확인
          2. `SOURCE_BRANCH.txt` 확인
          3. `REPOSITORY/`를 작업 디렉터리로 사용
          4. `npm ci`
          5. `npm run typecheck`
          6. `npm run lint`
          7. `npm test -- --reporter=dot`
          8. `npm run build`
          9. 개발지시문에 적힌 Stadium/Full Entry/Audio/Builder browser acceptance를 최신 HEAD에서 재실행

          ## 포함

          - 현재 repository source
          - 3D Stadium / Full Entry / Spatial Home / Builder 구현
          - GitHub Actions browser verifier와 tools
          - 개발지시문
          - 현재 상태보고
          - source HEAD / branch / git status
          - 최근 50개 commit
          - 전체 파일 manifest
          - package SHA256

          ## 제외

          다음은 재생성 가능한 대용량/캐시이므로 포함하지 않습니다.

          - node_modules
          - dist
          - output
          - coverage
          - cache
          - .git object database

          Git history 요약은 `RECENT_50_COMMITS.txt`에 포함되어 있습니다.
          EOF

          (
            cd "$ROOT"
            sha256sum SOURCE_HEAD.txt SOURCE_BRANCH.txt HANDOFF/*.md > CORE_FILES_SHA256.txt
          )

          ZIP="SNAPN_SPORTS_V2_STADIUM_FULL_HANDOFF_2026-08-30.zip"
          (
            cd "$OUT"
            zip -qr "$ZIP" "SNAPN_SPORTS_V2_STADIUM_HANDOFF_2026-08-30"
            sha256sum "$ZIP" > "$ZIP.sha256"
          )

      - name: Upload single final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: snapn-stadium-v2-full-handoff
          path: |
            ${{ runner.temp }}/handoff-out/SNAPN_SPORTS_V2_STADIUM_FULL_HANDOFF_2026-08-30.zip
            ${{ runner.temp }}/handoff-out/SNAPN_SPORTS_V2_STADIUM_FULL_HANDOFF_2026-08-30.zip.sha256
          if-no-files-found: error
          retention-days: 14
