name: Stadium Visual Verify

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Install Chromium renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/stadium-preview.log 2>&1 &
          echo $! > /tmp/stadium-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stadium-preview.log
          exit 1
      - name: Capture desktop and mobile stadium
        run: node tools/capture_stadium_visual.mjs
      - name: Upload stadium visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stadium-visual-evidence
          path: output/stadium-visual-evidence
          if-no-files-found: error
          retention-days: 14
