name: Stadium V14 Camera Once

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v14-refine.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V14 acceptance camera
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          old = '''    const zoom = Math.min(1.16, Math.max(0.90, zoom0));
              const angle = ((portrait ? 74 : 18) + orbit * (portrait ? 0.14 : 0.20)) * Math.PI / 180;
              const radius = (portrait ? 78 : 56) / zoom;
              const height = (portrait ? 24 : 19) / zoom;
              camera.fov = portrait ? 57 : 53;
              camera.aspect = cssWidth / cssHeight;
              camera.position.set(Math.sin(angle) * radius, height, Math.cos(angle) * radius);
              const target = portrait ? new THREE.Vector3(-4, 9.0, 0) : new THREE.Vector3(0, 6.5, -7.0);'''
          new = '''    const zoom = Math.min(1.14, Math.max(0.82, zoom0));
              const angle = ((portrait ? 70 : 18) + orbit * (portrait ? 0.12 : 0.18)) * Math.PI / 180;
              const radius = (portrait ? 108 : 88) / zoom;
              const height = (portrait ? 37 : 29) / zoom;
              camera.fov = portrait ? 58 : 51;
              camera.aspect = cssWidth / cssHeight;
              camera.position.set(Math.sin(angle) * radius, height, Math.cos(angle) * radius);
              const target = portrait ? new THREE.Vector3(0, 7.0, -4.0) : new THREE.Vector3(0, 7.0, -5.0);'''
          if old not in text:
              raise SystemExit('expected V14 camera block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit V14 camera
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: pull back V14 acceptance camera"
          git push
