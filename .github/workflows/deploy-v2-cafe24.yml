name: Deploy V2 to Cafe24

# Manual-only deployment of the static V2 build to snapnsports.com/v2/.
# Requires repository Actions secrets (Settings → Secrets and variables →
# Actions), configured by the owner — values never live in the repo:
#   CAFE24_FTP_SERVER    e.g. ftp.snapnsports.com (or the Cafe24 FTP host)
#   CAFE24_FTP_USERNAME
#   CAFE24_FTP_PASSWORD
# Optional variable (Settings → Variables → Actions):
#   CAFE24_FTP_SERVER_DIR  target directory, default www/v2/

on:
  workflow_dispatch:

concurrency:
  group: deploy-v2-cafe24
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Deploy dist/ to /v2/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE24_FTP_SERVER }}
          username: ${{ secrets.CAFE24_FTP_USERNAME }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ vars.CAFE24_FTP_SERVER_DIR != '' && vars.CAFE24_FTP_SERVER_DIR || 'www/v2/' }}
          dangerous-clean-slate: false
