name: Deploy V2 to Cafe24

# Deployment of the static V2 build to snapnsports.com/v2/.
# Triggered by pushing to the deploy/v2 pointer branch (or manually via
# workflow_dispatch). Requires repository Actions secrets (Settings →
# Secrets and variables → Actions), configured by the owner — values
# never live in the repo. Preferred: a single secret named CAFE24 whose
# value is three lines — FTP server / username / password. Individual
# secrets CAFE24_FTP_SERVER / CAFE24_FTP_USERNAME / CAFE24_FTP_PASSWORD
# take precedence when present.
# Optional variable (Settings → Variables → Actions):
#   CAFE24_FTP_SERVER_DIR  target directory relative to the FTP login
#                          home, default v2/ (this account's FTP home
#                          has no www/ wrapper - it is the doc root).

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/v2

concurrency:
  group: deploy-v2-cafe24
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve FTP credentials
        env:
          S: ${{ secrets.CAFE24_FTP_SERVER }}
          U: ${{ secrets.CAFE24_FTP_USERNAME }}
          P: ${{ secrets.CAFE24_FTP_PASSWORD }}
          COMBINED: ${{ secrets.CAFE24 }}
        run: |
          if [ -z "$S" ] && [ -n "$COMBINED" ]; then
            S=$(printf '%s\n' "$COMBINED" | sed -n 1p | tr -d '\r' | xargs)
            U=$(printf '%s\n' "$COMBINED" | sed -n 2p | tr -d '\r' | xargs)
            P=$(printf '%s\n' "$COMBINED" | sed -n 3p | tr -d '\r')
          fi
          # Strip an accidental scheme/trailing slash so both lftp's
          # positional host arg and the .netrc "machine" line match.
          S=$(printf '%s' "$S" | sed -E 's#^ftps?://##; s#/+$##')
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::FTP credentials incomplete. Easiest fix: edit the repository secret named CAFE24 so its value is exactly three lines - line 1 FTP server, line 2 username, line 3 password."
            exit 1
          fi
          echo "::add-mask::$P"
          {
            echo "FTP_SERVER=$S"
            echo "FTP_USERNAME=$U"
            echo "FTP_PASSWORD=$P"
          } >> "$GITHUB_ENV"
          echo "FTP credentials resolved (server: $S)."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Probe SFTP with the same credentials (diagnostic, non-blocking)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          encode() { awk '{printf "%s%%0A", $0}'; }
          target="${{ vars.CAFE24_FTP_SERVER_DIR != '' && vars.CAFE24_FTP_SERVER_DIR || 'v2/' }}"
          SSHPASS="$FTP_PASSWORD" sshpass -e sftp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=no -b - "$FTP_USERNAME@$FTP_SERVER" > "$RUNNER_TEMP/sftp_probe.log" 2>&1 <<SFTPCMDS
          mkdir $target
          ls -la
          bye
          SFTPCMDS
          sftp_status=$?
          echo "sftp probe exit=$sftp_status"
          echo "::notice title=SFTP probe (same login, port 22)::$(printf 'exit=%s%%0A' "$sftp_status")$(cat "$RUNNER_TEMP/sftp_probe.log" | encode)"
          set -e

      - name: Deploy dist/ to /v2/ via lftp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

          target="${{ vars.CAFE24_FTP_SERVER_DIR != '' && vars.CAFE24_FTP_SERVER_DIR || 'v2/' }}"

          # Credentials via .netrc rather than an lftp command string, so
          # nothing in the password needs shell/lftp quoting.
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine $FTP_SERVER
          login $FTP_USERNAME
          password $FTP_PASSWORD
          NETRC
          chmod 600 "$HOME/.netrc"

          set +e
          lftp -d -e "
            set ftp:ssl-allow no;
            set net:max-retries 2;
            set net:timeout 20;
            set net:reconnect-interval-base 3;
            set mirror:parallel-transfer-count 1;
            debug 3;
            open $FTP_SERVER;
            set cmd:fail-exit no;
            mkdir -p \"$target\";
            set cmd:fail-exit yes;
            cd \"$target\";
            lcd dist;
            mirror -R --verbose=3 --parallel=1 . .;
            bye
          " > "$RUNNER_TEMP/lftp.log" 2>&1
          status=$?
          set -e
          rm -f "$HOME/.netrc"
          encode() { awk '{printf "%s%%0A", $0}'; }
          if [ "$status" -ne 0 ]; then
            tail -c 4000 "$RUNNER_TEMP/lftp.log" > "$RUNNER_TEMP/lftp_tail.log"
            echo "::error title=lftp exit $status::$(cat "$RUNNER_TEMP/lftp_tail.log" | encode)"
            exit "$status"
          fi
          echo "lftp mirror completed."
          echo "--- lftp transcript (tail) ---"
          tail -c 2000 "$RUNNER_TEMP/lftp.log" || true

      - name: Smoke check /v2/
        run: |
          sleep 8
          curl -sf https://snapnsports.com/v2/ | grep -q "SnapN Sports V2"
          echo "live: https://snapnsports.com/v2/ serves the V2 shell"
