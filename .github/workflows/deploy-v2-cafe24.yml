name: Deploy V2 to Cafe24

# Deployment of the static V2 build to snapnsports.com/v2/.
# Triggered by pushing to the deploy/v2 pointer branch (or manually via
# workflow_dispatch). Requires repository Actions secrets (Settings →
# Secrets and variables → Actions), configured by the owner — values
# never live in the repo:
#   CAFE24_FTP_SERVER    e.g. ftp.snapnsports.com (or the Cafe24 FTP host)
#   CAFE24_FTP_USERNAME
#   CAFE24_FTP_PASSWORD
# Optional variable (Settings → Variables → Actions):
#   CAFE24_FTP_SERVER_DIR  target directory, default www/v2/

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/v2

concurrency:
  group: deploy-v2-cafe24
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight secrets
        env:
          S: ${{ secrets.CAFE24_FTP_SERVER }}
          U: ${{ secrets.CAFE24_FTP_USERNAME }}
          P: ${{ secrets.CAFE24_FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$S" ] && missing="$missing CAFE24_FTP_SERVER"
          [ -z "$U" ] && missing="$missing CAFE24_FTP_USERNAME"
          [ -z "$P" ] && missing="$missing CAFE24_FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. Register them under Settings > Secrets and variables > Actions > Repository secrets (not Variables, not Environment secrets)."
            exit 1
          fi
          echo "All three FTP secrets are present."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Deploy dist/ to /v2/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE24_FTP_SERVER }}
          username: ${{ secrets.CAFE24_FTP_USERNAME }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ vars.CAFE24_FTP_SERVER_DIR != '' && vars.CAFE24_FTP_SERVER_DIR || 'www/v2/' }}
          dangerous-clean-slate: false

      - name: Smoke check /v2/
        run: |
          sleep 8
          curl -sf https://snapnsports.com/v2/ | grep -q "SnapN Sports V2"
          echo "live: https://snapnsports.com/v2/ serves the V2 shell"
