name: Stadium Builder Browser Verify

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-builder-browser.trigger

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Install Chromium renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/stadium-builder-preview.log 2>&1 &
          echo $! > /tmp/stadium-builder-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stadium-builder-preview.log
          exit 1
      - name: Capture Stadium Builder
        run: |
          node --test tools/stadium-frame-analysis.test.mjs
          node tools/capture_stadium_builder.mjs
      - name: Upload Builder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stadium-builder-evidence
          path: output/stadium-builder-evidence
          if-no-files-found: error
          retention-days: 14
