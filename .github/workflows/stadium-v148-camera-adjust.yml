name: Stadium V14.8 Camera Adjust

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v148-camera-adjust.trigger

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move camera inside safe bowl radius
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          replacements = {
              '    const zoom = Math.min(1.14, Math.max(0.82, zoom0));': '    const zoom = Math.min(1.10, Math.max(0.86, zoom0));',
              '    const radius = (portrait ? 108 : 88) / zoom;': '    const radius = (portrait ? 52 : 38) / zoom;',
              '    const height = (portrait ? 37 : 29) / zoom;': '    const height = (portrait ? 30 : 24) / zoom;',
              '    camera.fov = portrait ? 58 : 51;': '    camera.fov = portrait ? 72 : 66;',
              '    const target = portrait ? new THREE.Vector3(0, 7.0, -4.0) : new THREE.Vector3(0, 7.0, -5.0);': '    const target = portrait ? new THREE.Vector3(0, 7.0, -2.0) : new THREE.Vector3(0, 6.0, -4.0);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected camera line not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit camera adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "fix: place V14 camera inside safe bowl radius"
          git push
