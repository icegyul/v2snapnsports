name: Stadium V15.6 Type Fix

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v156-type-fix.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow roof glow sprite material type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          old = '    const sprite = new THREE.Sprite(material);'
          new = '    const sprite = new THREE.Sprite(material as THREE.SpriteMaterial);'
          if old not in text:
              raise SystemExit('sprite material construction line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit V15.6 type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "fix: narrow V15.6 roof glow sprite material"
          git push
