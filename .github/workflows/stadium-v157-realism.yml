name: Stadium V15.10 Camera Lights

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise camera and strengthen roof lighting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          replacements = {
              '  scene.fog = new THREE.Fog(0x0c141c, 125, 290);': '  scene.fog = new THREE.Fog(0x0c141c, 112, 275);',
              '  scene.environmentIntensity = 0.68;': '  scene.environmentIntensity = 0.72;',
              '      opacity: 0.27,': '      opacity: 0.31,',
              '  for (let i = 0; i < 20; i += 1) {': '  for (let i = 0; i < 24; i += 1) {',
              '    const angle = (i / 20) * TAU;': '    const angle = (i / 24) * TAU;',
              '    sprite.position.set(Math.cos(angle) * 98.5, 36.9, Math.sin(angle) * 70.0);': '    sprite.position.set(Math.cos(angle) * 95.6, 35.8, Math.sin(angle) * 67.8);',
              '    sprite.scale.set(6.4, 4.2, 1);': '    sprite.scale.set(5.2, 3.6, 1);',
              '      emissiveIntensity: 3.2,': '      emissiveIntensity: 3.9,',
              '  const floodGeometry = addDisposable(geometries, new THREE.BoxGeometry(1.85, 0.34, 0.52));': '  const floodGeometry = addDisposable(geometries, new THREE.BoxGeometry(1.55, 0.30, 0.48));',
              '    const height = (portrait ? 32 : 24) / zoom;': '    const height = (portrait ? 35 : 25) / zoom;',
              '    camera.fov = portrait ? 60 : 58;': '    camera.fov = portrait ? 62 : 58;',
              '    const target = portrait ? new THREE.Vector3(0, 14.2, -5.5) : new THREE.Vector3(0, 12.0, -5.0);': '    const target = portrait ? new THREE.Vector3(0, 17.2, -6.2) : new THREE.Vector3(0, 13.4, -5.4);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected V15.10 token not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit V15.10 camera lights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: refine V15.10 stadium camera and roof lights"
          git push
