name: Stadium V15.22 Mobile Final Framing

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten final mobile stadium framing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/stadium/stadiumV149Cinematic.css')
          text = path.read_text()
          replacements = {
              '    transform:translateY(-2%) scale(1.10)!important;': '    transform:translateY(-10%) scale(1.12)!important;',
              '    transform-origin:50% 52%!important;': '    transform-origin:50% 54%!important;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'V15.22 expected one CSS token, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit V15.22 final mobile framing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/features/stadium/stadiumV149Cinematic.css
          git commit -m "feat: tighten V15.22 mobile stadium framing"
          git push
