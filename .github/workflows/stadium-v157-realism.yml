name: Stadium V15.11 Syntax Fix

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix V15.11 roof light allocation syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          old = 'const floodMaterial = addDisposable\n    materials,'
          new = 'const floodMaterial = addDisposable(\n    materials,'
          if old not in text:
              raise SystemExit('V15.11 syntax target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit V15.11 syntax fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "fix: repair V15.11 roof light allocation syntax"
          git push
