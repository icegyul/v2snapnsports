name: Stadium V15.16 Portrait Composition

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine portrait optical composition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          replacements = {
              'const radius = 44;': 'const radius = 48;',
              'camera.fov = 82;': 'camera.fov = 80;',
              'camera.zoom = 0.62;': 'camera.zoom = 0.72;',
              'camera.position.set(Math.sin(angle) * radius, 30.5, Math.cos(angle) * radius);': 'camera.position.set(Math.sin(angle) * radius, 26.0, Math.cos(angle) * radius);',
              'camera.lookAt(new THREE.Vector3(-6, 6.0, 0));': 'camera.lookAt(new THREE.Vector3(-6, 11.0, 0));',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'V15.16 expected one token, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit V15.16 portrait composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: refine V15.16 portrait stadium composition"
          git push
