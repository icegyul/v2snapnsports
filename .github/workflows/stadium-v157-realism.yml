name: Stadium V15.12c Safe Background

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocking scene background path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          for line in [
              '  scene.background = environmentTexture;\n',
              '  scene.backgroundIntensity = 0.34;\n',
              '  scene.backgroundBlurriness = 0.20;\n',
          ]:
              if line not in text:
                  raise SystemExit(f'V15.12c rollback line not found: {line!r}')
              text = text.replace(line, '', 1)
          path.write_text(text)
          PY
      - name: Add safe cinematic hero atmosphere
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/stadium/stadiumV149Cinematic.css')
          text = path.read_text()
          marker = '.shell-main.stadium-home-page .stadium-hero{\n  background:'
          if marker not in text:
              layer = '''.shell-main.stadium-home-page .stadium-hero{
                background:
                  radial-gradient(ellipse at 52% 9%,rgba(92,119,139,.22) 0%,rgba(40,58,72,.11) 28%,rgba(5,11,17,0) 58%),
                  linear-gradient(180deg,#0b1218 0%,#101a22 32%,#050a0f 74%,#020507 100%)!important;
              }
              '''
              text = layer + text
          path.write_text(text)
          PY
      - name: Commit V15.12c safe background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts apps/web/src/features/stadium/stadiumV149Cinematic.css
          git commit -m "fix: use safe V15.12c stadium background"
          git push
