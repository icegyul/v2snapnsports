name: Stadium V15.22b Mobile Final Framing

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten final mobile stadium framing safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/stadium/stadiumV149Cinematic.css')
          text = path.read_text()
          old_transform = '    transform:translateY(-2%) scale(1.10)!important;'
          new_transform = '    transform:translateY(-10%) scale(1.12)!important;'
          if text.count(old_transform) != 1:
              raise SystemExit(f'V15.22b mobile transform count={text.count(old_transform)}')
          text = text.replace(old_transform, new_transform, 1)
          idx = text.index(new_transform)
          tail = text[idx:]
          old_origin = '    transform-origin:50% 52%!important;'
          if old_origin not in tail:
              raise SystemExit('V15.22b mobile origin not found after mobile transform')
          tail = tail.replace(old_origin, '    transform-origin:50% 54%!important;', 1)
          text = text[:idx] + tail
          path.write_text(text)
          PY
      - name: Commit V15.22b final mobile framing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/features/stadium/stadiumV149Cinematic.css
          git commit -m "feat: tighten V15.22b mobile stadium framing"
          git push
