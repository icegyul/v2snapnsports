name: Stadium V15.23 Material Realism

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine grass crowd and lighting realism
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()
          replacements = {
              'ctx.fillStyle = i % 2 === 0 ? "#1a4c2d" : "#205532";': 'ctx.fillStyle = i % 2 === 0 ? "#183d28" : "#1d472c";',
              'vignette.addColorStop(0, "rgba(255,255,225,0.045)");': 'vignette.addColorStop(0, "rgba(238,244,222,0.026)");',
              'vignette.addColorStop(1, "rgba(0,18,8,0.12)");': 'vignette.addColorStop(1, "rgba(0,12,6,0.18)");',
              'ctx.globalAlpha = 0.075;': 'ctx.globalAlpha = 0.055;',
              'ctx.fillStyle = i % 3 === 0 ? "#b7d39c" : "#071b0c";': 'ctx.fillStyle = i % 3 === 0 ? "#8da77c" : "#0a180e";',
              'if (value > 0.965) return accent.clone().multiplyScalar(0.62 + hash(seed, 7) * 0.18);': 'if (value > 0.985) return accent.clone().multiplyScalar(0.42 + hash(seed, 7) * 0.14);',
              'if (value > 0.925) return new THREE.Color(0x553632);': 'if (value > 0.925) return new THREE.Color(0x40383a);',
              'if (value > 0.80) return new THREE.Color(0x615f5a);': 'if (value > 0.80) return new THREE.Color(0x53544f);',
              'if (value > 0.55) return new THREE.Color(0x474c52);': 'if (value > 0.55) return new THREE.Color(0x41464a);',
              'if (value > 0.30) return new THREE.Color(0x343b43);': 'if (value > 0.30) return new THREE.Color(0x30363b);',
              'return new THREE.Color(0x1d2329);': 'return new THREE.Color(0x20262b);',
              'if (value > 0.72) return new THREE.Color(0x8f6c59);': 'if (value > 0.72) return new THREE.Color(0x806653);',
              'if (value > 0.40) return new THREE.Color(0x785442);': 'if (value > 0.40) return new THREE.Color(0x6d5142);',
              'return new THREE.Color(0x5e4337);': 'return new THREE.Color(0x59453b);',
              'new THREE.MeshStandardMaterial({ map: grassTexture, bumpMap: grassBumpTexture, bumpScale: 0.038, roughness: 0.91, metalness: 0.0 })': 'new THREE.MeshStandardMaterial({ map: grassTexture, bumpMap: grassBumpTexture, bumpScale: 0.028, roughness: 0.96, metalness: 0.0 })',
              'scene.add(new THREE.HemisphereLight(0xc8d9eb, 0x101811, 0.96));': 'scene.add(new THREE.HemisphereLight(0xc3d2df, 0x101611, 0.84));',
              'scene.add(new THREE.AmbientLight(0xeaf2f7, 0.18));': 'scene.add(new THREE.AmbientLight(0xdce6ec, 0.15));',
              'const key = new THREE.DirectionalLight(0xeaf3ff, 1.55);': 'const key = new THREE.DirectionalLight(0xe7eff5, 1.38);',
              'const fill = new THREE.DirectionalLight(0xffe1ad, 0.55);': 'const fill = new THREE.DirectionalLight(0xffdfb0, 0.38);',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'V15.23 expected one token, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit V15.23 material realism
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: refine V15.23 stadium material realism"
          git push
