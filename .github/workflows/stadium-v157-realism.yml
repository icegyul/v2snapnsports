name: Stadium V15.7 Realism

on:
  push:
    branches:
      - feature/v2-stadium-first-screen-complete
    paths:
      - tools/stadium-v157-realism.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stadium openings grass relief and cinematic portrait camera
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/three/stadiumWebglV14.ts')
          text = path.read_text()

          if 'function makeGrassBumpTexture(' not in text:
              marker = 'function makeScoreboardTexture('
              fn = "\n".join([
                  'function makeGrassBumpTexture(textures: Set<THREE.Texture>): THREE.Texture {',
                  '  const canvas = document.createElement("canvas");',
                  '  canvas.width = 256;',
                  '  canvas.height = 256;',
                  '  const ctx = canvas.getContext("2d");',
                  '  if (!ctx) throw new Error("stadium grass bump canvas unavailable");',
                  '  const image = ctx.createImageData(canvas.width, canvas.height);',
                  '  for (let y = 0; y < canvas.height; y += 1) {',
                  '    for (let x = 0; x < canvas.width; x += 1) {',
                  '      const i = (y * canvas.width + x) * 4;',
                  '      const blade = 104 + ((x * 17 + y * 31 + (x * y) % 37) % 48);',
                  '      image.data[i] = blade;',
                  '      image.data[i + 1] = blade;',
                  '      image.data[i + 2] = blade;',
                  '      image.data[i + 3] = 255;',
                  '    }',
                  '  }',
                  '  ctx.putImageData(image, 0, 0);',
                  '  const texture = addDisposable(textures, new THREE.CanvasTexture(canvas));',
                  '  texture.wrapS = THREE.RepeatWrapping;',
                  '  texture.wrapT = THREE.RepeatWrapping;',
                  '  texture.repeat.set(18, 12);',
                  '  return texture;',
                  '}',
                  '',
              ])
              text = text.replace(marker, fn + marker, 1)

          old = '  const grassTexture = makePitchTexture(textures);\n  grassTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());\n  const pitchMaterial = addDisposable(\n    materials,\n    new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.94, metalness: 0.0 }),\n  );'
          new = '  const grassTexture = makePitchTexture(textures);\n  grassTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());\n  const grassBumpTexture = makeGrassBumpTexture(textures);\n  grassBumpTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());\n  const pitchMaterial = addDisposable(\n    materials,\n    new THREE.MeshStandardMaterial({ map: grassTexture, bumpMap: grassBumpTexture, bumpScale: 0.055, roughness: 0.91, metalness: 0.0 }),\n  );'
          if old not in text:
              raise SystemExit('pitch material block not found')
          text = text.replace(old, new, 1)

          shirt_old = "\n".join([
              'function crowdShirt(seed: number, accent: THREE.Color): THREE.Color {',
              '  const value = hash(seed, 4);',
              '  if (value > 0.93) return accent.clone().multiplyScalar(0.82 + hash(seed, 7) * 0.24);',
              '  if (value > 0.88) return new THREE.Color(0x763829);',
              '  if (value > 0.83) return new THREE.Color(0x5c594e);',
              '  if (value > 0.62) return new THREE.Color(0x85827b);',
              '  if (value > 0.34) return new THREE.Color(0x4f5358);',
              '  return new THREE.Color(0x24282d);',
              '}',
          ])
          shirt_new = "\n".join([
              'function crowdShirt(seed: number, accent: THREE.Color): THREE.Color {',
              '  const value = hash(seed, 4);',
              '  if (value > 0.965) return accent.clone().multiplyScalar(0.62 + hash(seed, 7) * 0.18);',
              '  if (value > 0.925) return new THREE.Color(0x553632);',
              '  if (value > 0.80) return new THREE.Color(0x615f5a);',
              '  if (value > 0.55) return new THREE.Color(0x474c52);',
              '  if (value > 0.30) return new THREE.Color(0x343b43);',
              '  return new THREE.Color(0x1d2329);',
              '}',
          ])
          if shirt_old not in text:
              raise SystemExit('crowd shirt block not found')
          text = text.replace(shirt_old, shirt_new, 1)
          text = text.replace('  const accentColor = new THREE.Color(recipe.accentColor).multiplyScalar(0.55);', '  const accentColor = new THREE.Color(recipe.accentColor).multiplyScalar(0.40);', 1)
          text = text.replace('      seats.setColorAt(index, section % 9 === 0 ? accentColor : baseColor);', '      seats.setColorAt(index, section % 13 === 0 ? accentColor : baseColor);', 1)

          if 'function addStadiumOpenings(' not in text:
              marker = 'function buildStadium('
              fn = "\n".join([
                  'function addStadiumOpenings(',
                  '  group: THREE.Group,',
                  '  geometries: Set<THREE.BufferGeometry>,',
                  '  materials: Set<THREE.Material>,',
                  '): void {',
                  '  const portalMaterial = addDisposable(',
                  '    materials,',
                  '    new THREE.MeshStandardMaterial({ color: 0x05080b, roughness: 0.97, metalness: 0.01 }),',
                  '  );',
                  '  const glassMaterial = addDisposable(',
                  '    materials,',
                  '    new THREE.MeshStandardMaterial({ color: 0x193342, emissive: 0x07151e, emissiveIntensity: 0.42, roughness: 0.22, metalness: 0.18 }),',
                  '  );',
                  '  const portalGeometry = addDisposable(geometries, new THREE.BoxGeometry(5.8, 3.2, 1.25));',
                  '  const suiteGeometry = addDisposable(geometries, new THREE.BoxGeometry(7.0, 2.1, 0.55));',
                  '  for (const [rx, rz, y, count] of [[69, 48.5, 6.0, 9], [88, 62.0, 17.0, 10], [106, 75.0, 28.0, 9]] as const) {',
                  '    for (let i = 0; i < count; i += 1) {',
                  '      const angle = Math.PI + ((i + 0.5) / count) * Math.PI;',
                  '      const portal = new THREE.Mesh(portalGeometry, portalMaterial);',
                  '      portal.position.set(Math.cos(angle) * rx, y, Math.sin(angle) * rz);',
                  '      portal.rotation.y = -angle + Math.PI / 2;',
                  '      portal.castShadow = true;',
                  '      group.add(portal);',
                  '      if (y > 10) {',
                  '        const suite = new THREE.Mesh(suiteGeometry, glassMaterial);',
                  '        suite.position.set(Math.cos(angle) * (rx - 0.45), y + 2.15, Math.sin(angle) * (rz - 0.32));',
                  '        suite.rotation.y = -angle + Math.PI / 2;',
                  '        group.add(suite);',
                  '      }',
                  '    }',
                  '  }',
                  '}',
                  '',
              ])
              text = text.replace(marker, fn + marker, 1)

          old = '  for (let i = 0; i < Math.min(recipe.tierCount, tiers.length); i += 1) {\n    addTier(group, geometries, materials, tiers[i], recipe, seatMaterial, concreteMaterial);\n  }\n\n  addEllipticRing('
          new = '  for (let i = 0; i < Math.min(recipe.tierCount, tiers.length); i += 1) {\n    addTier(group, geometries, materials, tiers[i], recipe, seatMaterial, concreteMaterial);\n  }\n  addStadiumOpenings(group, geometries, materials);\n\n  addEllipticRing('
          if old not in text:
              raise SystemExit('stadium openings call insertion point not found')
          text = text.replace(old, new, 1)

          replacements = {
              '  const scoreboardGeometry = addDisposable(geometries, new THREE.BoxGeometry(25, 7.2, 1.0));': '  const scoreboardGeometry = addDisposable(geometries, new THREE.BoxGeometry(31, 9.2, 1.0));',
              '  const screenGeometry = addDisposable(geometries, new THREE.PlaneGeometry(21.8, 4.7));': '  const screenGeometry = addDisposable(geometries, new THREE.PlaneGeometry(27.0, 6.2));',
              '    const angle = ((portrait ? 70 : 18) + orbit * (portrait ? 0.12 : 0.18)) * Math.PI / 180;': '    const angle = ((portrait ? 24 : 18) + orbit * (portrait ? 0.12 : 0.18)) * Math.PI / 180;',
              '    const height = (portrait ? 30 : 24) / zoom;': '    const height = (portrait ? 27 : 24) / zoom;',
              '    camera.fov = portrait ? 64 : 60;': '    camera.fov = portrait ? 58 : 58;',
              '    const target = portrait ? new THREE.Vector3(0, 13.5, -4.0) : new THREE.Vector3(0, 12.0, -5.0);': '    const target = portrait ? new THREE.Vector3(0, 11.5, -5.0) : new THREE.Vector3(0, 12.0, -5.0);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected V15.7 line not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit V15.7 realism refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/three/stadiumWebglV14.ts
          git commit -m "feat: add V15.7 stadium openings grass relief and portrait camera"
          git push
