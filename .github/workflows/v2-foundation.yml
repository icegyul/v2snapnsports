name: V2 Foundation

on:
  push:
    branches: [main, feature/v2-foundation-integration, ci/v2-stadium-rebuild-verify]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm run build
